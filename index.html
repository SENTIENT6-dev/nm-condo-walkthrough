<style>
/* Layout: full-bleed 3D canvas; a quiet glass HUD in the corners, like a site-walk tablet. Single dark HUD look on purpose. */
:root {
  --hud: rgba(24, 22, 20, 0.72);
  --hud-strong: rgba(24, 22, 20, 0.88);
  --line: rgba(255, 246, 232, 0.16);
  --ink: #f6efe4;
  --muted: #c9bfae;
  --accent: #d9b27c;
  --display: "Fraunces", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #1a1816; color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.hud { position: fixed; z-index: 5; background: var(--hud); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; }
#brand { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 10px 14px; max-width: min(340px, calc(100vw - 32px)); }
#brand h1 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
#brand p { margin: 4px 0 0; font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
#where { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); padding: 8px 12px; font-size: 0.8rem; display: flex; gap: 8px; align-items: center; }
#where .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
#where span.lbl { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.66rem; color: var(--muted); }
#rooms { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 6px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); }
#rooms button { font: 500 0.8rem var(--body); color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 8px 11px; cursor: pointer; white-space: nowrap; }
#rooms button:hover { background: rgba(255, 246, 232, 0.08); }
#rooms button[aria-pressed="true"] { background: var(--accent); color: #1f1a14; }
#rooms button:focus-visible, #help button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#help { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(58px + env(safe-area-inset-top, 0px)); max-width: 260px; padding: 8px 12px; font-size: 0.74rem; color: var(--muted); line-height: 1.5; }
#help kbd { font: 600 0.7rem var(--body); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
#help button { font: 500 0.74rem var(--body); color: var(--ink); background: var(--hud-strong); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; margin-top: 6px; cursor: pointer; }
#pad { position: fixed; z-index: 6; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: 112px; height: 112px; border-radius: 50%; background: var(--hud); border: 1px solid var(--line); touch-action: none; display: none; }
#knob { position: absolute; left: 36px; top: 36px; width: 40px; height: 40px; border-radius: 50%; background: rgba(217, 178, 124, 0.85); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: #1a1816; font-family: var(--display); font-size: 1.1rem; color: var(--muted); }
@media (pointer: coarse) { #pad { display: block; } .desk { display: none; } }
@media (pointer: fine) { .touch { display: none; } }
@media (max-width: 560px) { #brand p { display: none; } #help { display: none; } #rooms button { padding: 7px 8px; font-size: 0.74rem; } }
</style>

    const cx = (w.x[0] + w.x[1]) / 2, cy = (w.y[0] + w.y[1]) / 2, thinX = w.x[1] - w.x[0] < w.y[1] - w.y[0];
    const l = new THREE.RectAreaLight ? null : null;
    const p = new THREE.PointLight('#dcebff', 0.55, 5.5, 2); p.position.set(cx + (thinX ? (cx > 0 ? -0.6 : 0.6) : 0), 1.4, -(cy + (thinX ? 0 : (cy < 0 ? 0.6 : -0.6)))); scene.add(p);
